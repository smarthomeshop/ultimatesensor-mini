# UltimateSensor Mini V1 Common Configuration
# Production ESP-IDF firmware with on-device Micro Wake Word.
# The original ESP-IDF and Micro Wake Word work was based on:
# https://github.com/HA-TB303/ultimatesensor_mini

substitutions:
  project_name: "smarthomeshop.ultimatesensor_mini"
  project_main_version: "3"
  project_version: "3.15"
  log_level: "INFO"
  wifi_fast_connect: "true"
  basic_manifest_url: ${update_manifest_url}
  complete_manifest_url: ${update_manifest_url}
  basic_cloud_manifest_url: ${update_manifest_url}
  complete_cloud_manifest_url: ${update_manifest_url}
  default_network: "WiFi Basic (local)"
  cloud_enabled: "false"
  wake_word: "okay_nabu"
  boot_sound_enabled: "true"
  boot_sound_volume: "50%"
  boot_sound_duration: "10s"
  speaker_volume: "60%"
  voice_not_configured_volume: "50%"
  voice_not_configured_duration: "5s"
  voice_not_configured_file: "https://raw.githubusercontent.com/smarthomeshop/ultimatesensor-mini/main/ultimatesensor-mini-v1/audio/voice-not-configured.wav"
  # Downloaded while compiling and then embedded in the firmware, so playback
  # never depends on the network and adopted dashboard configs need no file.
  boot_sound_file: "https://raw.githubusercontent.com/smarthomeshop/ultimatesensor-mini/main/ultimatesensor-mini-v1/audio/boot1.mp3"
# Mini V1 hardware has one LD2450 on these fixed UART pins.
  ld2450_uart_tx_pin: GPIO13
  ld2450_uart_rx_pin: GPIO14
  tracking_motion_sensor_id: tracking_moving_target

# Mini V1 supports LD2450 only. The shared package owns the UART, radar,
# entities, polygon zones, entry lines, people counting and panel API.
packages:
  voice: !include voice-assistant.yaml
  lighting: !include led-lighting.yaml
  ld2450:
    url: https://github.com/smarthomeshop/ld2450
    ref: v1.0.0
    files:
      - packages/ld2450-base.yaml
      - packages/ld2450-polygon-zones.yaml
    refresh: 1d
  radar_mounting: github://smarthomeshop/radar-mounting/packages/mounting/wall.yaml@v1.0.0
  radar_profile: github://smarthomeshop/radar-mounting/packages/radars/ld2450.yaml@v1.0.0

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  min_version: 2026.10.0
  on_boot:
    - priority: 600
      then:
        - media_player.volume_set:
            id: media_player_01
            volume: ${speaker_volume}
    - priority: 610
      then:
        - script.execute: sync_selected_firmware_source
        - update.check:
            id: firmware_update
    - priority: -100
      then:
        - script.execute: play_boot_sound
  project:
    name: ${project_name}
    version: ${project_version}
    on_update:
      then:
        - logger.log: "UltimateSensor Mini firmware updated successfully!"
        - light.turn_on:
            id: rgb_front_led
            brightness: 100%
            red: 0%
            green: 100%
            blue: 0%
            flash_length: 500ms

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: "default_16MB.csv"
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240: "y"
      CONFIG_ESP32_S3_BOX_BOARD: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  level: ${log_level}
  hardware_uart: UART0

api:

ota:
  - platform: esphome
    id: ota_esphome
  - platform: http_request
    id: ota_http_request

http_request:
  useragent: ultimatesensor-mini-esphome
  verify_ssl: false

update:
  - platform: http_request
    name: "${friendly_name} Firmware"
    id: firmware_update
    source: ${update_manifest_url}
    disabled_by_default: true

wifi:
  power_save_mode: light
  # Keep setup credentials independent of hardware versions and node names.
  ap:
    ssid: "ultimatesensor-mini"
    password: "ultimatesensor-mini"

captive_portal:
improv_serial:

preferences:
  # Configuration changes are rare; flush them promptly so a later power loss
  # does not revert calibration and tracking settings to their defaults.
  flash_write_interval: 10s

globals:
  - id: boot_animation_active
    type: bool
    restore_value: false
    initial_value: "false"

status_led:
  pin: GPIO19

i2c:
  id: bus_a
  sda: GPIO11
  scl: GPIO10
  scan: true
  frequency: 100kHz

script:
  - id: sync_selected_firmware_source
    then:
      - lambda: |-
          const std::string option = id(firmware_selector).current_option();
          if (option == "WiFi Complete (local)") {
            id(firmware_update).set_source_url("${complete_manifest_url}");
          } else if (option == "WiFi Basic + SmartHomeShop App (cloud)") {
            id(firmware_update).set_source_url("${basic_cloud_manifest_url}");
          } else if (option == "WiFi Complete + SmartHomeShop App (cloud)") {
            id(firmware_update).set_source_url("${complete_cloud_manifest_url}");
          } else {
            id(firmware_update).set_source_url("${basic_manifest_url}");
          }

  # Plays the SmartHomeShop start-up sound once the device has booted, so a
  # customer hears that the sensor is alive. Can be turned off per device with
  # the "Boot Sound" switch.
  - id: play_boot_sound
    mode: restart
    then:
      - if:
          condition:
            and:
              - switch.is_on: boot_sound_switch
              - lambda: |-
                  return std::string("${boot_sound_enabled}") == "true";
          then:
            - lambda: id(boot_animation_active) = true;
            - media_player.volume_set:
                id: media_player_01
                volume: ${boot_sound_volume}
            # The Mini has a single front LED, so a slow pulse is the visual
            # cue here instead of the sweep used on the 3-LED UltimateSensor.
            - light.turn_on:
                id: rgb_front_led
                brightness: 80%
                red: 0%
                green: 0%
                blue: 100%
                effect: "Slow Pulse"
            - media_player.speaker.play_on_device_media_file:
                id: media_player_01
                media_file: boot_sound_file
                announcement: true
            - delay: ${boot_sound_duration}
            - lambda: id(boot_animation_active) = false;
            - media_player.volume_set:
                id: media_player_01
                volume: ${speaker_volume}
            - script.execute: reset_voice_led

light:
  - platform: esp32_rmt_led_strip
    id: rgb_front_led
    name: "Front Light"
    pin: GPIO5
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    rmt_symbols: 96
    default_transition_length: 0s
    effects:
      - addressable_color_wipe:
          name: "Connecting"
          colors:
            - red: 60%
              green: 60%
              blue: 60%
              num_leds: 1
            - red: 60%
              green: 60%
              blue: 0%
              num_leds: 1
          add_led_interval: 100ms
          reverse: true
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 250ms
          update_interval: 250ms
          min_brightness: 50%
          max_brightness: 100%

  - platform: esp32_rmt_led_strip
    id: rgb_back_led
    name: "Back Light"
    pin: GPIO20
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    rmt_symbols: 96

i2s_audio:
  - id: i2s_in
    i2s_lrclk_pin: GPIO7
    i2s_bclk_pin: GPIO16
  - id: i2s_out
    i2s_lrclk_pin: GPIO8
    i2s_bclk_pin: GPIO18

microphone:
  - platform: i2s_audio
    i2s_audio_id: i2s_in
    id: microphone_01
    i2s_din_pin: GPIO15
    adc_type: external
    pdm: false
    channel: right
    sample_rate: 16000
    bits_per_sample: 32bit
    correct_dc_offset: true

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_out
    id: speaker_id
    dac_type: external
    i2s_dout_pin: GPIO17
    sample_rate: 48000
    bits_per_sample: 16bit
    channel: mono

  - platform: mixer
    id: mixer_speaker_id
    output_speaker: speaker_id
    source_speakers:
      - id: announcement_spk_mixer_input
      - id: media_spk_mixer_input

  - platform: resampler
    id: media_spk_resampling_input
    output_speaker: media_spk_mixer_input

  - platform: resampler
    id: announcement_spk_resampling_input
    output_speaker: announcement_spk_mixer_input

media_player:
  - platform: speaker
    id: media_player_01
    name: "Media Player"
    task_stack_in_psram: true
    files:
      - id: boot_sound_file
        file: "${boot_sound_file}"
      - id: voice_not_configured_file
        file: "${voice_not_configured_file}"
    media_pipeline:
      speaker: media_spk_resampling_input
      num_channels: 1
      format: NONE
    announcement_pipeline:
      speaker: announcement_spk_resampling_input
      num_channels: 1
      format: NONE

binary_sensor:
  - platform: status
    name: "Status"

  - platform: template
    id: occupancy_state
    name: "Occupancy"
    device_class: occupancy
    lambda: return id(tracking_presence).state;

sensor:
  - platform: sound_level
    passive: false
    microphone:
      microphone: microphone_01
      channels: [0]
      gain_factor: 1
    rms:
      id: microphone_rms
      name: "Microphone RMS"
    peak:
      id: microphone_peak
      name: "Microphone Peak"
    measurement_duration: 200ms

  - platform: wifi_signal
    id: wifi_signal_sensor
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

  - platform: internal_temperature
    id: cpu_temperature
    name: "CPU Temperature"
    entity_category: diagnostic

  - platform: bh1750
    name: "Illuminance"
    id: illuminance
    address: 0x23
    update_interval: 120s

  - platform: sgp4x
    voc:
      id: voc_index
      name: "VOC Index"
    nox:
      id: nox_index
      name: "NOx Index"
    compensation:
      humidity_source: scd41_humidity
      temperature_source: scd41_temperature
    update_interval: 120s

  - platform: scd4x
    id: my_scd41
    co2:
      name: "CO2"
      id: scd41_co2
    temperature:
      name: "Temperature"
      id: scd41_temperature
      accuracy_decimals: 1
      filters:
        - lambda: return x + id(scd41_temperature_offset).state;
    humidity:
      name: "Humidity"
      id: scd41_humidity
      accuracy_decimals: 0
      filters:
        - lambda: return x + id(scd41_humidity_offset).state;
    measurement_mode: low_power_periodic
    temperature_offset: 2.3
    automatic_self_calibration: true
    update_interval: 60s

number:
  - platform: template
    name: "Temperature Offset"
    id: scd41_temperature_offset
    restore_value: true
    initial_value: 2.3
    min_value: -50.0
    max_value: 50.0
    step: 0.1
    entity_category: config
    unit_of_measurement: "C"
    optimistic: true
    update_interval: never
    mode: box

  - platform: template
    name: "Humidity Offset"
    id: scd41_humidity_offset
    restore_value: true
    initial_value: -1
    min_value: -50.0
    max_value: 50.0
    step: 0.1
    entity_category: config
    unit_of_measurement: "%"
    optimistic: true
    update_interval: never
    mode: box

switch:
  - platform: template
    id: boot_sound_switch
    name: "Boot Sound"
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

select:
  - platform: template
    id: firmware_selector
    name: "${friendly_name} Firmware Variant"
    icon: mdi:network
    entity_category: config
    optimistic: true
    restore_value: true
    options:
      - "WiFi Basic (local)"
      - "WiFi Complete (local)"
      - "WiFi Basic + SmartHomeShop App (cloud)"
      - "WiFi Complete + SmartHomeShop App (cloud)"
    initial_option: ${default_network}
    on_value:
      then:
        - script.execute: sync_selected_firmware_source
        - update.check:
            id: firmware_update

button:
  - platform: restart
    name: "Restart"
    entity_category: config

  - platform: safe_mode
    name: "Restart in Safe Mode"
    entity_category: diagnostic

  - platform: factory_reset
    name: "Factory Reset"
    entity_category: config

  - platform: template
    name: "CO2 Manual Calibration"
    entity_category: config
    on_press:
      then:
        - scd4x.perform_forced_calibration:
            value: 420
            id: my_scd41

text_sensor:
  - platform: version
    name: "ESPHome Version"
    hide_timestamp: true
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      id: ip_address
      name: "IP Address"
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      entity_category: diagnostic
    mac_address:
      id: mac_address
      name: "WiFi MAC Address"
      entity_category: diagnostic

  - platform: template
    name: "Hardware Version"
    lambda: |-
      return {"${ultimatesensor_mini_hardware_version}"};
    entity_category: diagnostic
