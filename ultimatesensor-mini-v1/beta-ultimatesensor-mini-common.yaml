# UltimateSensor Mini V1 beta compatibility wrapper.
# Beta builds now use the same production implementation and shared LD2450
# packages as regular Mini V1 firmware. Only product identity and logging differ.

substitutions:
  project_main_version: "2"
  project_version: "2.40-beta.94"
  project_name: "smarthomeshop.ultimatesensor_mini_beta"
  log_level: "DEBUG"
  cloud_enabled: "false"

packages:
  production_common: !include ultimatesensor-mini-common.yaml
