# Complete variant configuration.
# Adds the SPS30 particulate matter sensor and PM idle controls.

substitutions:
  sps30_time_id: local_led_sntp_time

esphome:
  on_boot:
    - priority: -100
      then:
        - delay: 10s
        - lambda: "id(sps30_controller_ready) = true;"
        - script.execute: sps30_evaluate_quiet_hours

globals:
  - id: sps30_controller_ready
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sps30_operating_mode_initialized
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sps30_applied_quiet_hours_active
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sps30_quiet_hours_active
    type: bool
    restore_value: false
    initial_value: "false"

sensor:
  - platform: sps30
    id: sps30_sensor
    pm_1_0:
      id: PM_1_0
      name: "PM <1um Weight concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 10
    pm_2_5:
      id: PM_2_5
      name: "PM <2.5um Weight concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 11
    pm_4_0:
      id: PM_4_0
      name: "PM <4um Weight concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 12
    pm_10_0:
      id: PM_10_0
      name: "PM <10um Weight concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 13
    pmc_0_5:
      id: PMC_0_5
      name: "PM <0.5um Number concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 14
    pmc_1_0:
      id: PMC_1_0
      name: "PM <1um Number concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 15
    pmc_2_5:
      id: PMC_2_5
      name: "PM <2.5um Number concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 16
    pmc_4_0:
      id: PMC_4_0
      name: "PM <4um Number concentration"
      web_server:
        sorting_group_id: sorting_group_air_quality
        sorting_weight: 17
    pmc_10_0:
      id: PMC_10_0
      name: "PM <10um Number concentration"
    pm_size:
      id: pm_size
      name: "Typical Particle size"
    address: 0x69
    update_interval: 60s

script:
  - id: sps30_idle_cycle
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              return id(pm_sensor_switch).state
                && !id(sps30_quiet_hours_active)
                && id(sps30_idle_interval).state <= 0;
          then:
            - sps30.start_measurement: sps30_sensor
          else:
            - while:
                condition:
                  lambda: |-
                    return id(pm_sensor_switch).state
                      && !id(sps30_quiet_hours_active)
                      && id(sps30_idle_interval).state > 0;
                then:
                  - sps30.start_measurement: sps30_sensor
                  - delay: !lambda |-
                      return (uint32_t)(30000 + id(sps30_update_interval).state * 2000);
                  - sps30.stop_measurement: sps30_sensor
                  - delay: !lambda |-
                      return (uint32_t)(id(sps30_idle_interval).state * 60000);

  - id: sps30_apply_operating_mode
    mode: restart
    then:
      - if:
          condition:
            lambda: "return id(sps30_controller_ready);"
          then:
            - if:
                condition:
                  lambda: |-
                    return !id(pm_sensor_switch).state
                      || id(sps30_quiet_hours_active);
                then:
                  - script.stop: sps30_idle_cycle
                  - sps30.stop_measurement: sps30_sensor
                else:
                  - script.execute: sps30_idle_cycle

  - id: sps30_evaluate_quiet_hours
    mode: restart
    then:
      - lambda: |-
          bool quiet = false;
          const auto now = id(${sps30_time_id}).now();
          if (id(sps30_quiet_hours_enabled).state && now.is_valid()) {
            const int hour = now.hour;
            const int start = (int) id(sps30_quiet_start_hour).state;
            const int end = (int) id(sps30_quiet_end_hour).state;
            quiet = start == end
              || (start < end && hour >= start && hour < end)
              || (start > end && (hour >= start || hour < end));
          }
          id(sps30_quiet_hours_active) = quiet;
      - if:
          condition:
            lambda: |-
              return id(sps30_controller_ready)
                && (!id(sps30_operating_mode_initialized)
                  || id(sps30_quiet_hours_active)
                    != id(sps30_applied_quiet_hours_active));
          then:
            - lambda: |-
                id(sps30_applied_quiet_hours_active) =
                  id(sps30_quiet_hours_active);
                id(sps30_operating_mode_initialized) = true;
            - script.execute: sps30_apply_operating_mode

number:
  - platform: template
    name: "SPS30 Update Interval"
    id: sps30_update_interval
    min_value: 10
    max_value: 300
    step: 10
    initial_value: 60
    unit_of_measurement: "s"
    icon: mdi:update
    entity_category: config
    optimistic: true
    restore_value: true
    on_value:
      then:
        - lambda: |-
            id(sps30_sensor).set_update_interval((uint32_t)(x * 1000));

  - platform: template
    name: "SPS30 Idle Interval"
    id: sps30_idle_interval
    min_value: 0
    max_value: 30
    step: 1
    initial_value: 5
    unit_of_measurement: "min"
    icon: mdi:sleep
    entity_category: config
    optimistic: true
    restore_value: true
    on_value:
      then:
        - script.execute: sps30_apply_operating_mode

  - platform: template
    name: "SPS30 Quiet Start Hour"
    id: sps30_quiet_start_hour
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 22
    unit_of_measurement: "h"
    icon: mdi:clock-start
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - script.execute: sps30_evaluate_quiet_hours

  - platform: template
    name: "SPS30 Quiet End Hour"
    id: sps30_quiet_end_hour
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    unit_of_measurement: "h"
    icon: mdi:clock-end
    entity_category: config
    optimistic: true
    restore_value: true
    mode: box
    on_value:
      - script.execute: sps30_evaluate_quiet_hours

switch:
  - platform: template
    name: "PM Sensor"
    id: pm_sensor_switch
    icon: "mdi:air-filter"
    restore_mode: RESTORE_DEFAULT_ON
    optimistic: true
    turn_on_action:
      - script.execute: sps30_apply_operating_mode
    turn_off_action:
      - script.execute: sps30_apply_operating_mode

  - platform: template
    name: "SPS30 Quiet Hours"
    id: sps30_quiet_hours_enabled
    icon: mdi:weather-night
    entity_category: config
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - script.execute: sps30_evaluate_quiet_hours
    turn_off_action:
      - script.execute: sps30_evaluate_quiet_hours

binary_sensor:
  - platform: template
    name: "SPS30 Quiet Hours Active"
    id: sps30_quiet_hours_active_sensor
    icon: mdi:fan-off
    entity_category: diagnostic
    lambda: "return id(sps30_quiet_hours_active);"

interval:
  - interval: 30s
    then:
      - script.execute: sps30_evaluate_quiet_hours
