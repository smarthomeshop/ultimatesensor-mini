# Optional UltimateSensor Mini V2 LD2460 tracking upgrade package.
# Use only after physically replacing/removing the LD2450 module and installing the LD2460 upgrade.
# Keep the LD2412 installed; it remains the reliable close-range presence fallback.

substitutions:
  ld2460_tx_pin: GPIO4
  ld2460_rx_pin: GPIO5
  # LD2460 reports target presence but does not classify moving/still targets.
  tracking_motion_sensor_id: tracking_presence

packages:
  ld2460:
    url: https://github.com/smarthomeshop/ld2460
    ref: main
    files:
      - tracking-ld2460.yaml
      - packages/ld2460-polygon-zones.yaml
    refresh: 1d
